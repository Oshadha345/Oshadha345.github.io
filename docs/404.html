<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var l = window.location;
        try {
          sessionStorage.setItem("spa-redirect", l.pathname + l.search + l.hash);
        } catch (e) {}
        l.replace(l.origin + "/");
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
